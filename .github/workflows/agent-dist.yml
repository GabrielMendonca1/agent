name: Agent distribution

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (required only for publication)
        required: false
        type: string
      publish:
        description: Publish the merged assets to a GitHub release
        default: false
        type: boolean
  push:
    branches: [ci/agent-dist]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: ubuntu-24.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: windows-2022
            platform: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      # Assets (agent-distribution.mjs, install.*) must be byte-identical across hosts to merge.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: git config --global core.longpaths true
      - name: Short Windows build root
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\adtmp | Out-Null
          'AGENT_DIST_TMP=C:\adtmp' >> $env:GITHUB_ENV
      - run: node scripts/agent-dist.mjs --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  smoke-linux:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: agent-linux-x64
          path: dist
      - name: Native bootstrap and fake Mark profile
        shell: bash
        run: |
          set -euo pipefail
          home=$(mktemp -d)
          trap 'rm -rf "$home"' EXIT
          export HOME="$home"
          export PI_CODING_AGENT_DIR="$home/.agent"
          export AGENT_STORE="$home/s"
          export AGENT_WARM_START=0
          export AGENT_RELEASE_DIR="$GITHUB_WORKSPACE/dist"
          bash dist/install.sh --adopt-launcher
          agent="$home/.local/bin/agent"
          "$agent" --version
          "$agent" overlay-status
          mark="$home/.pi/agent"
          mkdir -p "$mark"
          printf '%s\n' '{"defaultModel":"fixture-mark"}' > "$mark/settings.json"
          json=$("$agent" migrate-from-mark --dry-run --json)
          node -e 'const r = JSON.parse(process.argv[1]); if (!r.dryRun) throw new Error("Missing dry-run report")' "$json"
          if [ -e "$PI_CODING_AGENT_DIR/auth.json" ]; then echo 'Unexpected credentials' >&2; exit 1; fi

  smoke-windows:
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: agent-win32-x64
          path: dist
      - name: Native bootstrap and fake Mark profile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $homeDir = 'C:\as-' + [guid]::NewGuid().ToString('N').Substring(0,8)
          New-Item -ItemType Directory $homeDir | Out-Null
          try {
            $env:USERPROFILE = $homeDir
            $env:HOME = $homeDir
            $env:PI_CODING_AGENT_DIR = Join-Path $homeDir '.agent'
            $env:AGENT_STORE = Join-Path $homeDir 's'
            $env:AGENT_WARM_START = '0'
            $env:AGENT_RELEASE_DIR = (Resolve-Path dist).Path
            & pwsh -NoProfile -File dist/install.ps1 --adopt-launcher
            if ($LASTEXITCODE -ne 0) { throw 'install.ps1 failed' }
            $agent = Join-Path $homeDir '.local/bin/agent.cmd'
            & $agent --version
            if ($LASTEXITCODE -ne 0) { throw 'agent --version failed' }
            & $agent overlay-status
            if ($LASTEXITCODE -ne 0) { throw 'agent overlay-status failed' }
            $mark = Join-Path $homeDir '.pi/agent'
            New-Item -ItemType Directory -Force $mark | Out-Null
            '{"defaultModel":"fixture-mark"}' | Set-Content (Join-Path $mark 'settings.json')
            $json = & $agent migrate-from-mark --dry-run --json
            if ($LASTEXITCODE -ne 0) { throw 'Mark dry-run failed' }
            $report = ($json -join "`n") | ConvertFrom-Json
            if (-not $report.dryRun) { throw 'Missing dry-run report' }
            if (Test-Path (Join-Path $env:PI_CODING_AGENT_DIR 'auth.json')) { throw 'Unexpected credentials' }
          } finally {
            Remove-Item -Recurse -Force $homeDir
          }

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [build, smoke-linux, smoke-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      AGENT_RELEASE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-*
          path: hosts
      - name: Require exactly one archive per platform
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[a-zA-Z0-9_.+-]+$ ]] || { echo 'A valid tag is required for publication' >&2; exit 1; }
          for p in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            n=$(find "hosts/agent-$p" -maxdepth 1 -name "agent-*-$p.tar.gz" | wc -l)
            [ "$n" -eq 1 ] || { echo "Expected exactly one $p archive, found $n" >&2; exit 1; }
          done
      - name: Merge and sign (fail-closed without signing key)
        shell: bash
        env:
          AGENT_SIGNING_PRIVATE_KEY: ${{ secrets.AGENT_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AGENT_SIGNING_PRIVATE_KEY:-}" ]; then
            echo 'AGENT_RELEASE_SIGNING_KEY secret is required to publish signed assets' >&2
            exit 1
          fi
          node scripts/agent-dist.mjs --merge hosts/agent-darwin-arm64 hosts/agent-darwin-x64 hosts/agent-linux-x64 hosts/agent-linux-arm64 hosts/agent-win32-x64 --out dist --tag "$RELEASE_TAG"
          test -s dist/SHA256SUMS.sig
          test -s dist/latest.json
          node --input-type=module <<'JS'
          import { createPublicKey } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          import { runInNewContext } from 'node:vm';
          import { RELEASE_PUBLIC_KEY_PEM, verifyManifestSignature } from './dist/agent-distribution.mjs';
          const raw = process.env.AGENT_SIGNING_PRIVATE_KEY;
          const pem = raw.includes('-----BEGIN ') ? raw : Buffer.from(raw, 'base64').toString('utf8');
          const publicKey = createPublicKey({ key: pem, format: 'pem' });
          const publicKeyPem = publicKey.export({ type: 'spki', format: 'pem' });
          const spki = key => key.export({ type: 'spki', format: 'der' });

          function embeddedInstallerKey(file) {
            // Parse only the static JS string, not the enclosing shell or bootstrap.
            const declaration = /^const RELEASE_PUBLIC_KEY_PEM[ \t]*=[ \t]*('(?:[^'\\\r\n]|\\.)*'|"(?:[^"\\\r\n]|\\.)*"|`(?:[^`\\$]|\\.)*`)[ \t]*;\r?$/gm;
            const matches = [...readFileSync(file, 'utf8').matchAll(declaration)];
            if (matches.length !== 1) throw new Error(`${file}: expected one RELEASE_PUBLIC_KEY_PEM string literal`);
            return runInNewContext(matches[0][1]);
          }

          for (const [file, embedded] of [
            ['dist/agent-distribution.mjs', () => RELEASE_PUBLIC_KEY_PEM],
            ['dist/install.sh', () => embeddedInstallerKey('dist/install.sh')],
            ['dist/install.ps1', () => embeddedInstallerKey('dist/install.ps1')],
          ]) {
            const value = embedded()?.trim();
            if (!value) throw new Error(`${file}: RELEASE_PUBLIC_KEY_PEM is empty`);
            let key;
            try {
              if (!value.startsWith('-----BEGIN PUBLIC KEY-----')) throw new Error();
              key = createPublicKey(value);
            } catch {
              throw new Error(`${file}: RELEASE_PUBLIC_KEY_PEM is not a valid SPKI PEM public key`);
            }
            if (!spki(key).equals(spki(publicKey))) throw new Error(`${file}: RELEASE_PUBLIC_KEY_PEM does not match the signing key`);
          }
          verifyManifestSignature('dist/SHA256SUMS', 'dist/SHA256SUMS.sig', publicKeyPem);
          JS
          test "$(find dist -maxdepth 1 -name 'agent-*.tar.gz' | wc -l)" -eq 5
      - name: Publish only on explicit request
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* -R "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" dist/* --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes 'Native Agent distributions; SHA256SUMS signed with Ed25519 (SHA256SUMS.sig).' -R "$GITHUB_REPOSITORY"
          fi
